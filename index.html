    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Website Showcase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1.5rem;
            color: #1e1e1e;
        }

        .showcase {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 2.5rem;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.04), 0 8px 24px -6px rgba(0, 0, 0, 0.02);
            padding: 2.5rem 2.5rem 3rem;
            text-align: center;
        }

        .header {
            margin-bottom: 2.5rem;
        }

        .header .icon-wrap {
            font-size: 2.8rem;
            color: #ddd;
            margin-bottom: 0.5rem;
        }

        .header h1 {
            font-weight: 400;
            font-size: 1.8rem;
            letter-spacing: -0.02em;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .header h1 i {
            font-weight: 300;
            color: #888;
            font-size: 1.6rem;
        }

        .header h1 span {
            font-weight: 600;
            background: linear-gradient(135deg, #1e1e1e, #555);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .sub {
            font-size: 1rem;
            font-weight: 350;
            color: #6b6b6b;
            letter-spacing: 0.3px;
            background: #f6f6f6;
            padding: 0.4rem 1.5rem;
            border-radius: 40px;
            display: inline-block;
            margin-top: 12px;
        }

        /* Main Preview Card */
        .preview-card {
            background: #fafafa;
            border-radius: 24px;
            border: 1px solid #f0f0f0;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            max-width: 700px;
            margin: 0 auto;
        }

        .preview-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08);
            border-color: #d0d0d0;
        }

        .preview-card .card-preview {
            width: 100%;
            aspect-ratio: 16 / 10;
            background: #f5f5f5;
            overflow: hidden;
            position: relative;
            border-bottom: 1px solid #f0f0f0;
        }

        .preview-card .card-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* Simple hover overlay - no play button */
        .preview-card .card-preview .preview-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .preview-card:hover .card-preview .preview-overlay {
            opacity: 1;
        }

        .preview-card .card-preview .preview-overlay .label {
            color: #fff;
            font-weight: 500;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 10px 28px;
            border-radius: 40px;
            letter-spacing: 0.5px;
        }

        .preview-card .card-name {
            padding: 1.2rem 1.5rem 1.5rem;
            text-align: center;
        }

        .preview-card .card-name h3 {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1e1e1e;
            letter-spacing: -0.01em;
        }

        .preview-card .card-name p {
            color: #888;
            font-size: 0.9rem;
            line-height: 1.6;
            margin-top: 4px;
        }

        .preview-card .card-name .view-hint {
            font-size: 0.8rem;
            color: #aaa;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .preview-card .card-name .view-hint i {
            font-size: 0.75rem;
        }

        .style-tags {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .style-tag {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 5px 16px;
            border-radius: 30px;
            background: #f5f5f5;
            color: #888;
            border: 1px solid #e8e8e8;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .style-tag.minimalistic { 
            color: #555; 
            background: #f5f5f5; 
            border-color: #ddd; 
        }
        .style-tag.fancy { 
            color: #b85a1a; 
            background: #fdf6f0; 
            border-color: #f0d5b8; 
        }
        .style-tag.blended { 
            color: #1a7a5a; 
            background: #f0f8f4; 
            border-color: #b8d5c8; 
        }

        .hint {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: #a8a8a8;
            letter-spacing: 0.3px;
            border-top: 1px solid #f2f2f2;
            padding-top: 2rem;
        }

        .hint i {
            margin: 0 4px;
            color: #c0c0c0;
        }

        @media (max-width: 768px) {
            .showcase { padding: 1.5rem 1.2rem; }
            .header h1 { font-size: 1.4rem; }
            .preview-card .card-name h3 { font-size: 1rem; }
            .style-tags { gap: 8px; }
            .style-tag { font-size: 0.6rem; padding: 4px 12px; }
        }

        @media (max-width: 480px) {
            .showcase { padding: 1.2rem 1rem; }
            .header h1 { font-size: 1.2rem; }
            .header .sub { font-size: 0.8rem; padding: 0.3rem 1rem; }
            .preview-card .card-preview .preview-overlay .label { 
                font-size: 0.75rem; 
                padding: 8px 20px; 
            }
            .style-tag { font-size: 0.55rem; padding: 3px 10px; }
        }
    </style>
</head>
<body>

<div class="showcase">
    <div class="header">
        <div class="icon-wrap">🎨</div>
        <h1>
            <i class="fas fa-window-maximize" style="font-weight: 300;"></i>
            mockup·<span>flow</span>
        </h1>
        <span class="sub"><i class="far fa-image" style="margin-right: 6px;"></i> view your business website samples</span>
    </div>

    <!-- Single Preview Card -->
    <div class="preview-card" onclick="openViewer()">
        <div class="card-preview" style="background: linear-gradient(135deg, #f5f5f5, #e8e8e8);">
            <img src="https://i.postimg.cc/hvJdf93P/minimalist-photography-style-of-minimalistic-and-artistic-website-photography.png" alt="Website Preview" />
            <div class="preview-overlay">
                <span class="label">✦ View All Styles</span>
            </div>
        </div>
        <div class="card-name">
            <h3>Your Business Website</h3>
            <p>Explore What purpose you need — Branding, Backend, and Booking</p>
            <div class="style-tags">
                <span class="style-tag minimalistic">⬡ Branding</span>
                <span class="style-tag fancy">✦ Backend</span>
                <span class="style-tag blended">◈ Booking </span>
            </div>
            <div class="view-hint">
                <i class="fas fa-external-link-alt"></i> click to preview all styles
            </div>
        </div>
    </div>

    <div class="hint">
        <i class="fas fa-arrow-up" style="font-size: 0.7rem;"></i> 
        click the card to open the viewer · switch between styles inside
    </div>
</div>

<script>
    // ============================================
    // OPEN VIEWER
    // ============================================
    function openViewer() {
        window.open('viewer.html?style=minimalistic', '_blank');
    }

    console.log('✨ Website Showcase loaded!');
    console.log('📱 Click the card to open the viewer');
    console.log('🔄 Switch between Minimalistic, Fancy, and Blended inside the viewer');
</script>
</body>
</html>
